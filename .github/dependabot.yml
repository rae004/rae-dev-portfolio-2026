# Supply chain hardening — see documentation/supply_chain_hardening.md
#
# Dependabot config matching the install-time posture set up in phases
# 1 and 2:
#
#   - 7-day cooldown for non-CVE updates (matches `minimum-release-age`
#     in our pnpm .npmrc files; PRs Dependabot opens with a fresher
#     version would otherwise fail CI at install time)
#   - 14-day cooldown for semver-major bumps (extra review window)
#   - CVE patches bypass cooldown automatically — they run through the
#     separate Dependabot security-update channel, which fires on
#     advisories regardless of this file
#   - Lambda npm workspaces grouped into a single PR per cycle so we
#     get one PR per cooldown window instead of three
#   - GitHub Actions get a 14-day cooldown because a poisoned Action
#     runs with workflow tokens (same reasoning as our manual SHA pins
#     in phase 2)
#
# Renovate config was the original plan; we switched to Dependabot
# after seeing it group-PR security patches correctly on its own
# (see PR #23 in main history).
version: 2

updates:
  # ---- Frontend (pnpm) ----
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
      semver-major-days: 14
      include:
        - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      frontend-devdeps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Block major bumps for packages where we have a deliberate version
    # constraint. Removing an entry below means "we are ready to evaluate
    # the next major" — at which point Dependabot will surface a PR.
    ignore:
      # daisyui — CLAUDE.md hard constraint: MUST stay on v4.x; v5 breaks
      # the entire theme system. Exact-pinned in package.json too.
      - dependency-name: "daisyui"
        update-types: ["version-update:semver-major"]
      # typescript — TS majors usually surface real type errors across
      # the codebase. Treat as a coordinated upgrade, not a Monday bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react — couples to Vite + React major lines.
      # Major bumps land here only when we deliberately upgrade Vite.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks — major bumps reshape rule names and
      # severities; absorbs into a separate lint hygiene pass.
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # @tanstack/router-cli + @tanstack/router-devtools — exact-pinned in
      # package.json (1.132.41) as part of the post-2026-05-11 router-
      # family lockdown. Block ALL Dependabot bumps (not just majors)
      # until GHSA-g7cv-rxg3-hmpx's patched list is fully stable and we
      # relax the @tanstack/react-router pin too.
      - dependency-name: "@tanstack/router-cli"
      - dependency-name: "@tanstack/router-devtools"
      - dependency-name: "@tanstack/react-router"

  # ---- Infrastructure / CDK (pnpm) ----
  - package-ecosystem: "npm"
    directory: "/infrastructure"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
      semver-major-days: 14
      include:
        - "*"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    ignore:
      # @types/node — must track the Node runtime our Lambdas + CDK
      # target. Currently Node 22 (per CLAUDE.md). Bump the types only
      # when we decide to bump the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript — same as in /frontend: TS majors are a coordinated
      # codebase upgrade, not a routine Dependabot bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ---- Lambda workspaces (npm) — batched into one PR ----
  - package-ecosystem: "npm"
    directories:
      - "/infrastructure/lambda/contact-form"
      - "/infrastructure/lambda/lightsail-automation"
      - "/infrastructure/lambda/wordpress-config"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
      semver-major-days: 14
      include:
        - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "lambdas"
    groups:
      lambda-deps:
        patterns:
          - "*"

  # ---- GitHub Actions (SHA-pinned; Dependabot maintains SHA + comment) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 14
      include:
        - "*"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # ---- Composer (WordPress theme dev tooling) ----
  - package-ecosystem: "composer"
    directory: "/wordpress/wp-content/themes/rae-portfolio"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
      semver-major-days: 14
      include:
        - "*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "wordpress"
