name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supply chain hardening — see documentation/supply_chain_hardening.md
# Default-deny: every job gets read-only contents and nothing else. Jobs
# that need more (write tokens, OIDC) opt in explicitly per-job.
permissions:
  contents: read

jobs:
  # Block any PR that introduces a high-severity vulnerable dep.
  # Free on public repos; on private repos this step requires GitHub
  # Advanced Security. The pnpm audit step below is the fallback.
  dependency-review:
    name: Dependency review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  frontend-lint:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          # Source of truth is the packageManager field in package.json,
          # which is integrity-pinned via Corepack-style sha512 hash.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (prod, high+)
        working-directory: ./frontend
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Format check
        working-directory: ./frontend
        run: pnpm format:check

      - name: Build (acts as type-check via tsc -b)
        working-directory: ./frontend
        run: pnpm build

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: ./frontend
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  wordpress-phpcs:
    name: WordPress PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        working-directory: ./wordpress/wp-content/themes/rae-portfolio
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        working-directory: ./wordpress/wp-content/themes/rae-portfolio
        run: composer run phpcs

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          package_json_file: infrastructure/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./infrastructure
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (prod, high+)
        working-directory: ./infrastructure
        run: pnpm audit --prod --audit-level=high

      - name: CDK synth
        working-directory: ./infrastructure
        env:
          CDK_DEFAULT_ACCOUNT: "233416806179"
          CDK_DEFAULT_REGION: us-east-1
        run: pnpm exec cdk synth RaePortfolioDev --quiet

  cdk-tests:
    name: CDK assertion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          package_json_file: infrastructure/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./infrastructure
        run: pnpm install --frozen-lockfile

      - name: Run jest tests
        working-directory: ./infrastructure
        run: pnpm test
