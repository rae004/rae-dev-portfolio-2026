name: Deploy Frontend

# Reusable workflow that builds the SPA and uploads it to S3 + invalidates
# CloudFront for ONE environment. Everything environment-specific comes from
# the GitHub Environment named by `environment` (its variables + secrets):
#
#   vars.S3_BUCKET                  e.g. rae-portfolio-dev-233416806179
#   vars.CLOUDFRONT_DISTRIBUTION_ID e.g. EY6SKG56NXSIP
#   vars.SITE_URL                   e.g. https://dev.rae-dev.com   (smoke test)
#   vars.BUILD_TARGET               dev | prod  → runs `pnpm build:<target>`
#   secrets.AWS_DEPLOY_ROLE_ARN     the github-deploy-<env> role from the CDK stack
#
# The `prod` Environment carries a required-reviewer rule, so any job that
# targets it — from any caller — pauses for approval. That rule, not this
# file, is what guarantees "no prod deploy without a human".
#
# Trigger modes:
#   - workflow_call: from release-please.yml (tag → dev → prod) and from
#     preview.yml (PR release candidate → dev).
#   - workflow_dispatch: manual, e.g. hotfix or re-deploy of a known ref.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment to deploy to (dev | prod)"
        required: true
        type: string
      ref:
        description: "Git ref to deploy (tag, branch, or SHA)"
        required: false
        type: string
        default: ""
      version_suffix:
        description: "Appended to the package version in the build (e.g. -rc.142.a1b2c3d)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment to deploy to"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      ref:
        description: "Git ref to deploy (defaults to current main)"
        required: false
        type: string
        default: ""

jobs:
  deploy-frontend:
    name: Deploy frontend to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time. Not cancel-in-progress: a deploy
    # that has started syncing S3 should finish rather than leave a half
    # bucket. preview.yml applies its own cancel-in-progress group upstream.
    concurrency: deploy-${{ inputs.environment }}
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read
    steps:
      # Supply chain hardening — all third-party Actions are pinned by SHA.
      # The trailing comment is the human-readable version; Dependabot
      # will keep both the SHA and the comment in sync on update.
      # See documentation/supply_chain_hardening.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # packageManager field in frontend/package.json is the source of
          # truth; it's integrity-pinned via Corepack sha512.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build (${{ vars.BUILD_TARGET }} target)
        working-directory: ./frontend
        env:
          APP_VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: pnpm build:${{ vars.BUILD_TARGET }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --no-progress

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'

      - name: Smoke test
        run: |
          echo "Waiting 30s for CloudFront invalidation to start propagating..."
          sleep 30
          for attempt in 1 2 3; do
            # Match the actual portfolio title content, not just any <title>
            # tag — a broken build that emits an empty <title></title> would
            # otherwise sneak past the gate.
            if curl -fsS "${{ vars.SITE_URL }}" | grep -q '<title>Rae Dev Portfolio</title>'; then
              echo "Smoke test passed (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "Smoke test failed after 3 attempts" >&2
          exit 1
