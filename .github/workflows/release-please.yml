name: Release Please

# Release flow (see documentation/production_deployment_plan.md):
#
#   merge release PR → tag vX.Y.Z
#     → deploy the tag to dev   (automatic)
#     → deploy the tag to prod  (pauses for the `prod` Environment's
#                                required reviewer)
#
# Prod only ever ships an artifact that has already been built and smoke
# tested on dev from the same tag.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        # Supply chain hardening: pinned by SHA, comment tracks version.
        # See documentation/supply_chain_hardening.md.
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-frontend-dev:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write   # OIDC token exchange in the called workflow
      contents: read
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: dev
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  deploy-frontend-prod:
    needs: [release-please, deploy-frontend-dev]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: prod
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
