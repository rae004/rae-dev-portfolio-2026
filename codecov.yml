# Soft coverage thresholds — these inform PR status checks but are
# allowed to drift modestly so individual PRs are not blocked by
# unrelated coverage shifts.
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 70%
        threshold: 5%
        informational: true

  precision: 2
  round: nearest

flags:
  frontend:
    paths:
      - frontend/src
    carryforward: true

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false
