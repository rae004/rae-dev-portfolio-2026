<!doctype html>
<!-- class for Theme transition for smooth theme switching -->
<html lang="en" class="transition-[color-scheme] duration-200 ease-in-out">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rae Dev Portfolio</title>
    <script>
      // Initialize theme immediately to prevent flash of unstyled content.
      // Keep the valid-theme list in sync with ThemeSwitcher.tsx and
      // tailwind.config.js's daisyui.themes array.
      ;(function () {
        const validThemes = [
          'corporate',
          'cmyk',
          'acid',
          'bumblebee',
          'lofi',
          'synthwave',
          'aqua',
          'cyberpunk',
          'retro',
          'black',
          'halloween',
          'forest',
          'dracula',
          'coffee',
        ]
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'black'
          : 'corporate'
        const saved = localStorage.getItem('theme')
        const theme = saved && validThemes.indexOf(saved) !== -1 ? saved : preferred
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body class="overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
