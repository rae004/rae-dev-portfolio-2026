# Supply chain hardening — see documentation/supply_chain_hardening.md
#
# In pnpm 11, settings that previously lived under the "pnpm" key in
# package.json moved to this file. We are not using pnpm workspaces here —
# this file exists solely to host the postinstall-script allowlist for
# this project.
#
# Any package not listed (or listed with `false`) will have its install
# scripts silently skipped at install time. This is the containment layer
# that would have blocked the TanStack 2026-05-11 payload from executing.
allowBuilds:
  esbuild: true
