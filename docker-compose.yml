version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    container_name: rae-portfolio-wp
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - ./wordpress:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
    depends_on:
      - db
    networks:
      - wordpress

  db:
    image: mysql:8.0
    container_name: rae-portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rae-portfolio-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress
    depends_on:
      - db
    networks:
      - wordpress

volumes:
  db_data:

networks:
  wordpress:
    driver: bridge